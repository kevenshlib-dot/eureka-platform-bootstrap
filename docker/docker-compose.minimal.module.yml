      # 参照官方 eureka-cli/moduleenv/module_env.go 的默认设置。
      SYSTEM_USER_ENABLED: "false"
      FOLIO_SYSTEM_USER_ENABLED: "false"
    # 该模块 Kafka 消费组多（authority 50 分区等），默认 384m 在授权后 OOM（exit 137）。
    deploy:
      resources:
        limits:
          memory: 640m
        reservations:
