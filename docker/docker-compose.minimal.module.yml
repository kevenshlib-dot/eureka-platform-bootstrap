    ports:
      - "29018:8081"
      - "10018:5005"
    environment:
      <<: *folio-module-env
      # Eureka 模式：系统用户由 mgr-tenant-entitlements 事件 + mod-users-keycloak 创建，
      # 禁用模块租户初始化时的旧式（Okapi）系统用户创建，否则升级授权流程中会因
